<mat-toolbar color="primary" class="color">
    <mat-toolbar-row fxLayout="row">
        <span class="heading">Forget Password</span>
    </mat-toolbar-row>
</mat-toolbar>
<mat-dialog-content class="mat-typography">
    <form [formGroup]="forgotPasswordForm">
        <div fxFlex fxLayout="column">
            <mat-form-field appearance="fill">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" required>
                <mat-error *ngIf="forgotPasswordForm.controls['email'].touched && forgotPasswordForm.controls['email'].invalid">
                    <span *ngIf="forgotPasswordForm.controls['email'].errors?.['required']">This field is mandatory.</span>
                    <span *ngIf="forgotPasswordForm.controls['email'].errors?.['pattern']">This field is invalid.</span>
                </mat-error>
            </mat-form-field>
            
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="center">
    <button mat-raised-button style="background-color: #a80000; color: white;" type="submit" (click)="handleSubmit()"
     [disabled]="!(forgotPasswordForm.valid && forgotPasswordForm.dirty)">Send</button>

     <button mat-raised-button style="background-color:rgb(34, 34, 34); color: white;" mat-dialog-close>Close</button>
</mat-dialog-actions>
