<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}


.sidebar {
  width: 260px;
  height: 100vh;
  background-color: #a80000;
  color: white;
  display: flex;
  flex-direction: column;
  padding-top: 25px;
}


.nav-list {
  list-style: none;
  width: 100%;
  padding: 0;
  margin: 0;
}


.nav-item {
  position: relative;
  margin: 20px 15px;              
  background: #fff;               
  border-radius: 8px;             
  transition: all 0.3s ease;
  overflow: hidden;
}


.nav-link {
  display: flex;
  align-items: center;
  gap: 15px;                     
  padding: 12px 18px;
  color: #a80000;
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  transition: 0.3s ease;
}


.nav-link #icon {
  font-size: 20px;
}


.nav-item:hover,
.nav-item.selected {
  background-color: #a80000;
}

.nav-item:hover .nav-link,
.nav-item.selected .nav-link {
  color: white;
}

.nav-item:hover #icon,
.nav-item.selected #icon {
  color: white;
}

.nav-item {
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}

</style>


<body>
  <div class="sidebar">
    <ul class="nav-list">
      <li class="nav-item active" *ngFor="let menuitem of menuItems.getMenuItems()" routerLinkActive="selected">
        <a [routerLink]="['/', menuitem.state]" *ngIf="(menuitem.role === '' || menuitem.role === tokenPayload.role)"
          class="nav-link">
          <span [class]="menuitem.icon" id="icon"></span>
          <span class="menuName">{{ menuitem.name }}</span>
        </a>
      </li>

    </ul>
  </div>


</body>
