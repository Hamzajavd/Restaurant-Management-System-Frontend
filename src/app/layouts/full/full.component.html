<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            padding: 0;
            margin: 0;
        }
        
        

        body {
            font-family: 'Poppins', sans-serif;
            padding: 0;
            margin: 0;
        }

        header {
            
            background-color: #a80000;
            width: 100%;
        }

        nav {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo {
            padding-left: 50px;
            font-size: 20px;
            font-weight: 500;
            color: white;
        }

        .hamburgur-icon,
        .user-icon {
            color: white;
            font-size: 20px;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
        }


        .user-icon:hover {
            background-color: white;
            color: #a80000;
        }

        .example-sidenav-container {
            width: auto;
            height: 100vh;
        }

        mat-sidenav {
            overflow: hidden;
            height: 100%;
        }

<body>
    <header>
        <nav>
            

            <div class="logo">

            </div>

    <mat-sidenav-container class="example-sidenav-container">
        <mat-sidenav #snav id="snav" class="dark-sidebar" [mode]="mobileQuery.matches ? 'side' : 'over'" fixedTopGap="0"
            [opened]="mobileQuery.matches" [disableClose]="mobileQuery.matches">
            <app-sidebar></app-sidebar>

        <mat-sidenav-content>
