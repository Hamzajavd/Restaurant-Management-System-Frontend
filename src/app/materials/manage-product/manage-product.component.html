<style>
 * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}


.container {
  
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 26px 65px;
}

.container .card {
   width: 100%; 
  display: flex;
  align-items: center;
}

 .container button {
   padding: 10px 20px;
    margin-left: auto;
    
    color: white;
    text-decoration: none;
    cursor: pointer;
    font-size: 15px;
    background-color: #a8000a;
    font-family: 'poppins', sans-serif;
    border: none;
    transition-duration: 0.5s;
  }

.container button:hover {
  background-color: #131313;
}

.container .card b span {

  font-size: 25px;
  text-transform: uppercase;
}


 


.form {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  padding: 12px 18px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  width: 70%;
  margin: 20px auto;
  transition: box-shadow 0.3s ease;
}

.form:hover {
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
}

.form label {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  letter-spacing: 0.3px;
}


.form input {
  padding: 8px 12px;
  border: 1.5px solid #ccc;
  border-radius: 6px;
  outline: none;
  font-size: 14px;
  transition: all 0.3s ease;
  width: 90%;
}

.form input:focus {
  border-color: #a80000;
  box-shadow: 0 0 4px rgba(168, 0, 0, 0.3);
}

.responsive_table {
  margin: 20px 60px;
  overflow-x: auto;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  color: rgb(124, 123, 123);

  font-size: 14px;
  text-align: left;
  padding: 14px 16px;
  border-bottom: 2px solid #f1f1f1;
}

td {
  font-weight: 500;
  padding: 12px 16px;
  font-size: 14px;
  border-bottom: 1px solid #f1f1f1;
}

tr:hover {
  background-color: #f9f9f9;
}

.action-link {
  display: flex;
  align-items: center;
  gap: 10px;
}

button[mat-icon-button] mat-icon {
  color: #a80000;
  transition: color 0.3s ease;
}

button[mat-icon-button]:hover mat-icon {
  color: #7c0000;
}


::-webkit-scrollbar {
  height: 6px;
}
::-webkit-scrollbar-thumb {
  background-color: #bbb;
  border-radius: 4px;
}


</style>




<div class="container">
    <div class="card">
    <b><span>Manage Products</span></b>
    <button (click)="handleAddAction()">Add Products</button>    
</div>
</div>

    
    <form class="form" appearance="fill">
        <label for="">Filter</label>
        <input (keyup)="applyFilter($event)" #input>
    </form>

<hr>



<div class="responsive_table">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
<ng-container matColumnDef="productName">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">{{element.productName}}</td>
</ng-container>


<ng-container matColumnDef="categoryName">
    <th mat-header-cell *matHeaderCellDef>Category Name</th>
    <td mat-cell *matCellDef="let element">{{element.categoryName}}</td>
</ng-container>

<ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let element">{{element.description}}</td>
</ng-container>

<ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef>Price</th>
    <td mat-cell *matCellDef="let element">{{element.price}}</td>
</ng-container>

<ng-container matColumnDef="edit">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let element" class="action-link">
        <button mat-icon-button (click)="handleEditAction(element)">
            <span><i class="fa-solid fa-pen-to-square"></i></span>
        </button>

        <button mat-icon-button (click)="handleDeleteAction(element)">
            <span><i class="fa-solid fa-trash"></i></span>
        </button>
        <mat-slide-toggle (change)="onChange($event.checked,element.id)" matTooltip="Activate or Deactivate Product" [checked]="element.status"></mat-slide-toggle>
    </td>
</ng-container>

<tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
<tr mat-row *matRowDef="let row ; columns:displayedColumns"></tr>
    </table>

</div>
