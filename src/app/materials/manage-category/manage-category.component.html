
<div class="card">
    <div class="Manage-category">
        <b><span class="heading">Manage Category</span></b>
        <button class="float-right" (click)="handleAddAction()">Add Category</button>
    </div>
</div>

<div class="card">
    
    <form class="form" appearance="fill">
        <label for="">Filter</label>
        <input (keyup)="applyFilter($event)" #input>
    </form>
</div>
<hr>

<div class="responsive_table">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>name</th>
            <td mat-cell *matCellDef="let element">{{element.name}}</td>
        </ng-container>

         <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element" class="action-link">
                <button mat-icon-button  (click)="handleEditAction(element)">
                    <mat-icon>edit</mat-icon>
                </button>
                
            </td>
              
        </ng-container>

         <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element" class="action-link">
               <button mat-icon-button (click)="handlDeleteAction(element)">
                    <mat-icon>delete</mat-icon>
                </button>
                
            </td>
              
        </ng-container>


        
         

        <tr mat-header-row *matHeaderRowDef="displayColumn; sticky:true"></tr>
        <tr mat-row *matRowDef="let row;columns:displayColumn"></tr>
    </table>
    
</div>
