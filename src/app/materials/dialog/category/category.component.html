
<mat-toolbar color="primary">
     <mat-toolbar-row fxLayout="row">
         <span class="title-center">{{dialogData.action}} Category</span>
     </mat-toolbar-row>
</mat-toolbar>

<mat-dialog-content>
<form [formGroup]="CategoryForm">
    <div fxFlex fxLayout="column">
        <div fxLayout="row wrap"></div>
        <mat-form-field appearance="fill">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" required>
            <mat-error *ngIf="CategoryForm.controls['name'].touched && CategoryForm.controls['name'].invalid">
                <span *ngIf="CategoryForm.controls['name'].errors?.['required']">This field is Mandatory.</span>
            </mat-error>
        </mat-form-field>
    </div>
</form>
</mat-dialog-content>
<mat-dialog-actions align="center">
    <button class="btn1" (click)="handleSubmit()" [disabled]="!(CategoryForm.valid && CategoryForm.dirty)">{{action}}</button>
    <button class="btn2" color="primary" (click)="closeDialog()"> close </button>
</mat-dialog-actions>
