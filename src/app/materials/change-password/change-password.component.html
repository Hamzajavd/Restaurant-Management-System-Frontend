<style>
mat-toolbar {
  background-color: #a8000a !important;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  font-size: 20px;
  font-weight: 500;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  border-top-left-radius: 6px;
  border-top-right-radius: 6px;
}




mat-toolbar-row {
  display: flex;
  justify-content: center;
  align-items: center;

}

.title-center {
  text-align: center;
  width: 100%;
  letter-spacing: 0.5px;
}





mat-dialog-actions {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 16px 0 20px;
  border-top: 1px solid #eee;
}


button[mat-raised-button] {
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  font-size: 14px;
  border-radius: 6px;
  padding: 8px 22px;
  min-width: 100px;
  cursor: pointer;
  transition: all 0.2s ease;
}

button[mat-raised-button][color="primary"] {
  background-color: #a8000a !important;
  color: #fff !important;
  box-shadow: 0 2px 4px rgba(32, 32, 32, 0.3);
}

button[mat-raised-button][color="primary"]:hover {
  background-color: #630107 !important;
  box-shadow: 0 3px 6px rgba(63, 81, 181, 0.4);
}

button[mat-raised-button]:not([color="primary"]) {
  background-color: #e0e0e0 !important;
  color: #333 !important;
}

button[mat-raised-button]:not([color="primary"]):hover {
  background-color: #d5d5d5 !important;
}


mat-error {
  margin-top: -4px;
}

mat-hint {
  margin-top: 8px;
  color: red;
}
  

</style>



  <mat-toolbar color="primary">
      <mat-toolbar-row fxLayout="row">
          <span class="title-center">Change Password</span>
      </mat-toolbar-row>
  </mat-toolbar>

  <mat-dialog-content>
      <form [formGroup]="changePasswordForm">
          <div fxFlex fxLayout="column">
              <mat-form-field>
                  <mat-label>Old Password</mat-label>
                  <input matInput formControlName="oldPassword" required>
                  <mat-error *ngIf="changePasswordForm.controls['oldPassword'].touched && changePasswordForm.controls['oldPassword'].invalid">
                      <span *ngIf="changePasswordForm.controls['oldPassword'].errors?.['required']">This field is mandatory.</span>
                  </mat-error>
              </mat-form-field>


              <mat-form-field appearance="fill">
                  <mat-label>New Password</mat-label>
                  <input matInput formControlName="newPassword" required>
                  <mat-error *ngIf="changePasswordForm.controls['newPassword'].touched && changePasswordForm.controls['newPassword'].invalid">
                      <span *ngIf="changePasswordForm.controls['newPassword'].errors?.['required']">This field is mandatory.</span>
                  </mat-error>
              </mat-form-field>



                <mat-form-field appearance="fill">
                  <mat-label>Confirm Password</mat-label>
                  <input matInput formControlName="confirmPassword" required>
                  <mat-error *ngIf="changePasswordForm.controls['confirmPassword'].touched && changePasswordForm.controls['confirmPassword'].invalid">
                      <span *ngIf="changePasswordForm.controls['confirmPassword'].errors?.['required']">This field is mandatory.</span>
                  </mat-error>
                  <mat-hint *ngIf="validateSubmit() && (changePasswordForm.controls['confirmPassword'].invalid)" >
                  <span>New Password & Confirm Password does not Match.</span>
              </mat-hint>
              </mat-form-field>

              


          </div>
      </form>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
      <button mat-raised-button color="primary" type="submit" (click)="handleChangePasswordSubmit()" [disabled]="validateSubmit() || !(changePasswordForm.value && changePasswordForm.dirty)">Update</button>
    <button mat-raised-button (click)="closeDialog()">Close</button>
  </mat-dialog-actions>
